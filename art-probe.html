<style>
body{font-family:system-ui;padding:20px;background:#e4e9f1}
#status{font-size:20px;font-weight:800;padding:12px;border-radius:10px;background:#fff;margin-bottom:14px}
iframe{width:100%;height:200px;border:2px solid #0d9488;border-radius:10px;background:#fff}
</style>
<div id="status">shell script: not run</div>
<div id="host"></div>
<script type="text/html" id="frame-test">
<!DOCTYPE html><html><head><style>body{font-family:system-ui;padding:16px;background:#0b1120;color:#5fe3a1}</style></head>
<body><div id="r">iframe inline script: NOT run</div>
<script>document.getElementById('r').textContent='iframe inline script: RAN ✓ ('+(2+2)+')';<\/script>
</body></html>
</script>
<script>
document.getElementById('status').textContent='shell script: RAN ✓';
try{
  var tpl=document.getElementById('frame-test').textContent;
  tpl=tpl.split('<\\/script>').join('<\/script>');
  var f=document.createElement('iframe');
  f.srcdoc=tpl;
  document.getElementById('host').appendChild(f);
  document.getElementById('status').textContent='shell script: RAN ✓ — iframe appended, srcdoc set';
}catch(e){
  document.getElementById('status').textContent='shell ERROR: '+e.message;
}
</script>
