name: models-ci

on:
  push:
    branches: [DEV, UAT, QA, main]
    paths:
      - "models/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "models/**"
      - "tests/**"
      - "pyproject.toml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install pytest scikit-learn numpy pandas joblib
      - name: Run the model test suite
        # Meridian, Sentinel, Crucible and the Cadence metrics tests run everywhere;
        # the Cadence model-reproduction test self-skips when the (untracked) UCI HAR
        # dataset is absent, as it is in CI.
        run: python -m pytest -q
