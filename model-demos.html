<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ardia Studio — watch the models reason</title>
<link rel="canonical" href="studio.html">
<meta http-equiv="refresh" content="0;url=studio.html">
<style>
  html,body{margin:0;height:100%;font-family:'Sora',system-ui,-apple-system,sans-serif;background:#f5f9fc;color:#12233a}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
  .logo{width:52px;height:52px;border-radius:10px;background:linear-gradient(135deg,#0a1628,#0e2040);border:1.5px solid rgba(20,184,166,.5);box-shadow:0 0 12px rgba(20,184,166,.25)}
  h1{font-size:19px;font-weight:800;margin:6px 0 0}
  p{font-size:14px;color:#5a6e87;margin:0;max-width:440px}
  a{display:inline-block;margin-top:8px;padding:11px 22px;border-radius:10px;background:linear-gradient(135deg,#0d7c6e,#0fa58e);color:#fff;font-weight:700;font-size:14px;text-decoration:none}
</style>
<script>
  // The demo carousel + the reasoning tiers now live together in the Studio.
  // Preserve any ?play=<model> deep link as ?model=<model> so it still opens that model.
  (function(){
    try{
      var q=new URLSearchParams(location.search);
      var k=q.get('play')||q.get('model');
      location.replace('studio.html'+(k?('?model='+encodeURIComponent(k)):''));
    }catch(e){ location.replace('studio.html'); }
  })();
</script>
</head>
<body>
  <div class="wrap">
    <div class="logo"></div>
    <h1>Ardia Studio</h1>
    <p>The model demos now live in the Studio — carousel, full-screen player, and the Swift · Cortex · Scholar reasoning tiers, all in one place.</p>
    <a href="studio.html">Open the Studio &rarr;</a>
  </div>
</body>
</html>
