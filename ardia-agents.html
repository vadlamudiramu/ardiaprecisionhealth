<!DOCTYPE html>
<html lang="en">

<title>Ardia — Agent Library</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e4e9f1;--bg2:#d8e0ea;--panel:#fff;--panel2:#eef2f8;--line:rgba(14,28,48,.10);--line2:rgba(14,28,48,.16);
 --txt:#0d1b2e;--mut:#54677f;--dim:#8697ac;
 --tara:#0d9488;--aria:#d97706;--lumen:#0284c7;--cadence:#059669;--tox:#7c3aed;--molec:#0891b2;--pulmo:#2563eb;--pama:#e11d48;--sentinel:#4f46e5;--crucible:#ea580c;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
h1,h2,h3,h4{font-family:'Sora',system-ui,sans-serif;letter-spacing:-.02em;font-weight:700;color:var(--txt)}
svg.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav{position:sticky;top:0;z-index:100;background:rgba(228,233,241,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:14px;height:64px;max-width:1400px;margin:0 auto;padding:0 24px}
.brand{display:flex;align-items:center;gap:11px}
.brand-badge{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#0a1628,#0e2040);border:1.5px solid rgba(20,184,166,.5);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:5px}
.brand-badge img{width:100%;height:100%;object-fit:contain}
.brand-txt{font-family:'Sora';font-weight:800;font-size:17px}.brand-txt span{color:var(--pulmo)}
.nav-links{margin-left:auto;display:flex;gap:4px;align-items:center}
.nav-links>a{font-size:13.5px;font-weight:500;color:var(--mut);padding:8px 12px;border-radius:9px}
.nav-links>a:hover,.nav-links>a.active{color:var(--txt);background:rgba(14,28,48,.05)}
.nav-cta{font-family:'Sora';font-weight:600;font-size:13px;background:var(--txt);color:#fff!important;padding:9px 16px;border-radius:10px}
@media(max-width:1050px){.nav-links>a:not(.nav-cta){display:none}}
.app{display:grid;grid-template-columns:300px 1fr;max-width:1400px;margin:0 auto;min-height:calc(100vh - 64px)}
@media(max-width:900px){.app{grid-template-columns:1fr}}
.side{border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto}
@media(max-width:900px){.side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}}
.side-h{font-size:10px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);margin:18px 8px 8px}
.side-h:first-child{margin-top:0}
.s-row{display:flex;align-items:center;gap:10px;padding:9px 11px;cursor:pointer;border-radius:10px;border-left:3px solid transparent;transition:.14s}
.s-row:hover{background:var(--panel2)}
.s-row.sel{background:color-mix(in srgb,var(--c) 9%,white);border-left-color:var(--c)}
.s-ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 13%,white);color:var(--c);flex-shrink:0}
.s-row .n{font-family:'Sora';font-weight:700;font-size:13.5px;flex:1}
.s-row .cnt{font-size:10.5px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,white);padding:2px 7px;border-radius:20px}
.s-row .chev{color:var(--dim);font-size:9px;transition:.2s}
.s-item.open .chev{transform:rotate(90deg);color:var(--c)}
.s-agents{display:none;padding:2px 0 6px 12px}
.s-item.open .s-agents{display:block}
.s-agent{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--mut);border-left:2px solid var(--line)}
.s-agent:hover{background:var(--panel2);color:var(--txt)}
.s-agent.sel{color:var(--c);border-left-color:var(--c);font-weight:600;background:color-mix(in srgb,var(--c) 7%,white)}
.s-agent svg.ic{width:15px;height:15px;flex-shrink:0}
.main{padding:32px 42px 90px;min-width:0}
@media(max-width:640px){.main{padding:24px 20px 70px}}
.crumb{font-size:12.5px;color:var(--mut);margin-bottom:16px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.crumb a{color:var(--c);font-weight:600;cursor:pointer}
.badge{font-size:9.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;padding:4px 9px;border-radius:5px;background:color-mix(in srgb,var(--c) 13%,white);color:var(--c)}
.a-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:8px}
.a-hic{width:54px;height:54px;border-radius:14px;background:color-mix(in srgb,var(--c) 13%,white);color:var(--c);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.a-hic svg.ic{width:26px;height:26px;stroke-width:1.7}
.a-cat{font-size:11.5px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.6px}
.a-head h1{font-size:clamp(24px,3.2vw,33px);line-height:1.1;margin:3px 0}
.a-desc{font-size:16px;color:var(--mut);line-height:1.6;max-width:840px;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:24px}
.a-desc b{color:var(--txt)}
.personas{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.persona{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;background:var(--panel);border:1px solid var(--line);padding:7px 13px;border-radius:100px;color:var(--mut)}
.persona svg.ic{width:14px;height:14px;color:var(--c)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:12px}
.metric{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:13px;padding:18px}
.metric .v{font-family:'Sora';font-weight:800;font-size:27px;color:var(--c);line-height:1.1}
.metric .l{font-size:12.5px;color:var(--mut);margin-top:5px;line-height:1.45}
.mnote{font-size:11.5px;color:var(--dim);font-style:italic;margin-bottom:26px}
.sec{margin-bottom:28px}
.sec-l{font-size:10.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec-l::before{content:'';width:15px;height:2px;background:var(--c);border-radius:2px}
/* conditions */
.cond-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:11px}
.cond{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 15px;border-left:3px solid var(--c)}
.cond .cn{font-weight:700;font-size:13.5px;color:var(--txt)}
.cond .cc{font-family:'JetBrains Mono';font-size:11px;color:var(--c);font-weight:600;margin-top:3px}
.cond .cd{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.5}
/* use case */
.uc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:14px}
.uc-n{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--c)}
.uc h3{font-size:18px;margin:4px 0 10px}
.trig{font-size:12.5px;color:var(--mut);background:var(--panel2);border-radius:8px;padding:9px 12px;margin-bottom:14px}
.trig b{color:var(--txt);font-weight:700}
.steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:9px}
.steps li{counter-increment:s;display:flex;gap:11px;font-size:13.5px;color:var(--mut);line-height:1.55}
.steps li::before{content:counter(s) ".";font-family:'JetBrains Mono';font-weight:700;color:var(--c);flex-shrink:0;min-width:18px}
.steps li b{color:var(--txt);font-weight:600}
.uc-out{display:flex;gap:10px;align-items:flex-start;margin-top:15px;padding-top:14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--txt);font-weight:500}
.uc-out svg.ic{width:17px;height:17px;color:#16a34a;flex-shrink:0;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-family:'JetBrains Mono';font-size:11.5px;font-weight:600;background:var(--panel);color:var(--mut);padding:6px 11px;border-radius:7px;border:1px solid var(--line)}
.chip.cd{color:var(--c);border-color:color-mix(in srgb,var(--c) 30%,white);background:color-mix(in srgb,var(--c) 6%,white)}
/* conversation */
.conv{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.bub{max-width:88%;font-size:13.5px;line-height:1.62}
.bub.u{align-self:flex-end;background:color-mix(in srgb,var(--c) 11%,white);border:1px solid color-mix(in srgb,var(--c) 25%,white);padding:11px 15px;border-radius:14px 14px 4px 14px;color:var(--txt);font-weight:500}
.bub.a{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);padding:13px 16px;border-radius:14px 14px 14px 4px;color:var(--mut)}
.bub.a .who{display:block;font-family:'Sora';font-size:10.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--c);margin-bottom:7px}
.bub.a b{color:var(--txt)}
.bub.a code{font-family:'JetBrains Mono';font-size:12px;background:color-mix(in srgb,var(--c) 10%,white);color:var(--c);padding:1px 5px;border-radius:4px;font-weight:600}
.ev{background:#fff8ec;border:1px solid #fcd34d;border-radius:11px;padding:14px 16px;font-size:12.5px;color:#78350f;line-height:1.55}
.ev b{color:#b45309}
.hipaa{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;padding:7px 12px;border-radius:8px}
.hchip svg.ic{width:14px;height:14px}
</style>
</head>

/* ---------- SOLUTIONS → AGENTS (actAVA-depth) ---------- */
const SOL=[
{k:'tox',seg:'Independent Labs · Reimbursement',c:'--tox',icon:'flask',name:'ToxIQ',role:'Toxicology Revenue Intelligence',agents:[
 {id:'tox-1',icon:'shield',cat:'Medical Necessity',badge:'Compliance',name:'Necessity Validation Agent',
  desc:'Validates every presumptive and definitive drug test against the governing payer LCD <b>before submission</b>, confirming a covered indication, a signed order, and MEAT-style documentation of clinical rationale — the single largest driver of <b>CO-50</b> toxicology denials.',
  personas:[['user','Lab Billing Manager'],['clip','Certified Coder'],['user','Ordering Clinician']],
  metrics:[['30–45%','Modelled reduction in CO-50 denial rate on presumptive/definitive panels'],['&lt;90 sec','Pre-submission verdict per claim'],['100%','Claims carrying a cited LCD basis']],
  conditions:[
   ['Opioid use disorder','F11.20 · F11.21','Chronic opioid therapy and MAT monitoring — the highest-volume covered indication for definitive testing.'],
   ['Stimulant use disorder','F14.20 · F15.20','Cocaine and amphetamine-type; drives multi-class definitive panels.'],
   ['Alcohol use disorder','F10.20','EtG/EtS confirmation; frequency caps are strictest here.'],
   ['Sedative/benzodiazepine UD','F13.20','Common co-occurring class requiring separate definitive justification.'],
   ['Chronic pain on COT','G89.29 · M54.5','Risk-stratified monitoring frequency (low/moderate/high) governs allowable testing cadence.'],
   ['Polysubstance use','F19.20','Justifies broader definitive class counts (G0483 22+ classes) when documented.']],
  codes:['80305','80306','80307','G0480','G0481','G0482','G0483','G0659'],
  denials:['CO-50','CO-151','CO-11','CO-16','CO-97','CO-B15'],
  uc:[
   {t:'Pre-submission necessity check',trig:'A toxicology order is finalised in the LIS, before the 837 is generated',
    steps:['De-identify the order and linked encounter under <b>HIPAA Safe Harbor</b> (18 identifiers) before any model call.',
     'Resolve the payer and plan year, then load the governing <b>LCD</b> (e.g. Palmetto L36037 / Novitas L35724) and its covered-indication list.',
     'Confirm the linked <b>ICD-10</b> appears on the covered list; score match confidence <b>0.0–1.0</b>.',
     'Verify a <b>signed ordering-provider record</b> exists with NPI and date.',
     'Scan the encounter note for documented clinical rationale — risk stratification, prior result, or change in therapy.',
     'Check the definitive class count billed against what the documentation supports (prevents <b>G0483</b> over-billing).',
     'Auto-pass claims scoring <b>≥0.90</b>; route <b>0.70–0.90</b> to a certified coder queue with the source evidence highlighted.',
     'Emit a fix-list for anything below 0.70 and write the decision to the <b>Sentinel</b> hash-chained audit trail.'],
    out:'Every claim leaves the lab either clean or with a named, actionable gap — never a silent CO-50 six weeks later.'},
   {t:'Risk-stratified frequency guard',trig:'Nightly sweep of the rolling 12-month testing history per patient',
    steps:['Aggregate all presumptive and definitive tests per de-identified patient across the period.',
     'Classify the documented monitoring tier (low / moderate / high risk) from the chart.',
     'Compare observed testing cadence against the payer LCD frequency ceiling for that tier.',
     'Flag patients trending toward a <b>CO-151</b> "frequency not supported" denial before the next order.',
     'Surface the specific documentation that would justify the higher cadence, if it exists.',
     'Return a per-provider report of cadence outliers for compliance review.'],
    out:'Frequency denials are prevented at the ordering step rather than appealed after the fact.'}],
  integ:['EDI 837P claim feed','EDI 835 remittance','LIS order interface (HL7 v2 / FHIR R4)','CMS LCD/NCD policy corpus','MolDX & MAC policy packs','Certified coder review queue','Sentinel audit + de-identification kernel'],
  datasets:['Public CMS LCD/NCD policy text','CARC/RARC code set (X12)','Synthetic toxicology claim corpus (Ardia-generated, no PHI)'],
  conv:[['u','Why did you flag claim 4471 for Mr. R — the diagnosis is right there.'],
   ['a','The diagnosis is on the claim, but that is not what the LCD asks for. Linked code is <code>F11.20</code> (opioid use disorder, uncomplicated), which <b>is</b> on the covered-indication list for Palmetto <code>L36037</code> — so the indication test passes at 0.94.<br><br>What fails is the <b>class count</b>. You are billing <code>G0483</code> (definitive, 22+ drug classes) but the encounter note documents monitoring for opioids, benzodiazepines and alcohol only — three classes. The note has no risk-stratification statement and no prior discordant result that would justify a broad panel. That mismatch is the pattern behind <b>CO-50</b> and <b>CO-B15</b> denials in your last 90 days.<br><br>My confidence that this claim denies as-billed is <b>0.86</b>, which puts it in the coder-review band, not auto-reject.'],
   ['u','So what do I do with it?'],
   ['a','Two clean paths, both defensible:<br><br><b>1. Re-code to the documented scope.</b> <code>G0481</code> covers 8–14 classes and matches what the note supports. Lower unit value, but it is a clean claim.<br><br><b>2. Strengthen the documentation.</b> If the ordering clinician genuinely assessed the patient as high-risk — prior polysubstance history, an unexpected result, a therapy change — that belongs in the note as an explicit risk-stratification statement. Add it and <code>G0483</code> becomes supportable.<br><br>I have drafted the query to the ordering provider for path 2. It requires a human to send — I do not contact clinicians on my own, and I do not decide which path you take.']],
  ev:'<b>Evidence status:</b> the reduction and confidence figures above are <b>modelled targets</b> from public denial-rate literature (HFMA/Change Healthcare) applied to a synthetic claim corpus — <b>not</b> measured Ardia production results. Ardia is pre-revenue. The reasoning logic is deterministic and unit-tested; end-to-end accuracy will be measured on a design-partner dataset under a BAA before any performance claim is published.',
  hipaa:['De-identified before any model call','Hash-chained audit of every decision','Human-in-the-loop on all coding changes','EKRA-aware — no volume-based inducement logic','Administrative safe harbor (21st C. Cures §520(o)(1)) — not a medical device']},
 {id:'tox-2',icon:'layers',cat:'Bundling & Panel Logic',badge:'Coding',name:'Bundling & Panel Agent',
  desc:'Applies presumptive→definitive bundling rules, panel-size ceilings and NCCI edits per payer, separating legitimately unbundleable lines from those that will be absorbed — the second-largest toxicology denial family.',
  personas:[['clip','Certified Coder'],['user','Lab Billing Manager']],
  metrics:[['20–30%','Modelled reduction in bundling-related write-offs'],['6','Payer edit families evaluated per claim'],['0','Silent absorptions — every bundle decision is explained']],
  conditions:[['Opioid use disorder','F11.20','Presumptive screen followed by definitive confirmation on the same DOS — the classic bundling trap.'],
   ['Polysubstance use','F19.20','Multi-class definitive panels where class-count tiers (G0480→G0483) must match documentation.'],
   ['Alcohol use disorder','F10.20','EtG/EtS confirmation often billed alongside a presumptive panel.'],
   ['Chronic pain on COT','G89.29','Reflex-to-definitive protocols require explicit medical-necessity linkage per payer.']],
  codes:['80305','80306','80307','G0480','G0481','G0482','G0483'],
  denials:['CO-97','CO-B15','CO-234','CO-4'],
  uc:[{t:'Same-DOS bundling adjudication',trig:'A claim contains both a presumptive and a definitive line for the same date of service',
    steps:['Identify all presumptive (<b>80305–80307</b>) and definitive (<b>G0480–G0483</b>) lines on the date of service.',
     'Load the payer\'s bundling policy and applicable <b>NCCI PTP</b> edit pairs for the code combination.',
     'Determine whether the definitive test was <b>reflexive</b> (auto-triggered by the screen) or <b>independently ordered</b> with its own documented rationale.',
     'Validate that the definitive class count is supported by the documented monitoring scope.',
     'Apply the correct modifier where the payer permits unbundling with justification; suppress it where they do not.',
     'Return a line-by-line verdict: payable as billed · re-code · expect absorption — each with the citation.'],
    out:'Coders see exactly which lines survive and why, instead of discovering absorption on the remittance.'}],
  integ:['EDI 837P','NCCI PTP edit tables','Payer-specific bundling policy packs','CPT/HCPCS crosswalk','Sentinel audit kernel'],
  datasets:['Public NCCI edit tables (CMS)','CARC/RARC code set','Synthetic multi-line claim corpus'],
  conv:[['u','Will the G0480 survive alongside the 80307 for this encounter?'],
   ['a','Not as billed. Both lines sit on the same date of service, and the note describes the definitive test as a <b>reflex</b> off the presumptive screen — the screen was positive for opiates, and the definitive fired automatically from the standing protocol.<br><br>Under this payer\'s bundling policy, a reflex definitive on the same DOS with no independently documented rationale is absorbed into the presumptive line. Expect <b>CO-97</b>.<br><br>What would change the outcome: an explicit statement that the definitive was ordered on clinical judgement — an unexpected result, a discordance with the prescribed regimen, or a documented change in the treatment plan. That makes it independently orderable and the line becomes defensible.'],
   ['u','Our protocol always reflexes. Is that a problem?'],
   ['a','It is not a compliance problem — reflex protocols are legitimate and common. It is a <b>documentation</b> problem: the protocol produces the test, but the payer needs a patient-specific reason for the confirmation, not a lab-wide rule.<br><br>Across your last 90 days I see <b>214</b> reflex definitive lines in this pattern. If even the clinically-justified subset carried a one-line rationale, the recoverable difference is material. I have drafted a documentation-template change for your medical director to review — that is a human decision, not mine.']],
  ev:'<b>Evidence status:</b> modelled from public NCCI edit logic and industry denial-mix data; the 214-line figure in the sample conversation is illustrative synthetic data. No Ardia production results exist yet — pre-revenue.',
  hipaa:['De-identified inputs','Deterministic, citable edit logic','Human approval on every re-code','Full audit trail']},
 {id:'tox-3',icon:'doc',cat:'Appeals',badge:'Recovery',name:'Appeal Construction Agent',
  desc:'Builds the evidence-backed appeal for a denied toxicology claim — citing the exact LCD section, attaching the diagnosis linkage and signed order, and drafting the medical-necessity narrative for a human reviewer to attest and send.',
  personas:[['user','Appeals Specialist'],['clip','Certified Coder'],['user','Medical Director']],
  metrics:[['$118 → &lt;$15','Modelled cost per appeal (HFMA baseline vs. automated draft)'],['&lt;5 min','Draft-ready appeal package'],['100%','Appeals carrying an explicit policy citation']],
  conditions:[['Opioid use disorder','F11.20 · F11.21','Most-appealed indication; MAT and COT monitoring rationale.'],['Polysubstance use','F19.20','Class-count justification appeals.'],['Alcohol use disorder','F10.20','Frequency-cap appeals on EtG/EtS.'],['Sedative/benzodiazepine UD','F13.20','Co-occurring class necessity appeals.']],
  codes:['80305-80307','G0480-G0483'],
  denials:['CO-50','CO-151','CO-97','CO-16','CO-11'],
  uc:[{t:'Denial-to-appeal package',trig:'An 835 remittance posts a denial on a toxicology claim',
    steps:['Parse the <b>835</b> and extract the <b>CARC/RARC</b> pair and the denied line detail.',
     'Classify the root cause — necessity, frequency, bundling, missing information, or coding mismatch.',
     'Assess appeal merit: retrieve the governing LCD section and check whether the record actually satisfies it.',
     'Suppress appeals with no factual basis — <b>a denial that is correct is not appealed</b>.',
     'For meritorious denials, assemble the packet: cited policy section, diagnosis linkage, signed order, encounter documentation.',
     'Draft the medical-necessity narrative grounded strictly in the retrieved record — no asserted facts.',
     'Route to a human reviewer for attestation; log the attestation in the audit chain before submission.'],
    out:'Appeals go out fast, cited, and only where they can actually win — with a named human on the record.'}],
  integ:['EDI 835 remittance','EDI 837 resubmission','CMS LCD/NCD corpus','Claude (behind Sentinel guardrails)','Reviewer attestation queue','Sentinel audit kernel'],
  datasets:['Public CMS LCD/NCD text','X12 CARC/RARC code set','Synthetic denial corpus'],
  conv:[['u','We got a CO-151 on a batch of 38 definitive claims. Worth appealing?'],
   ['a','Partly — and that distinction matters more than the volume.<br><br><b>CO-151</b> is "information submitted does not support this many services." I pulled all 38 and checked each against the frequency ceiling in the governing LCD for the documented risk tier:<br><br>• <b>23 claims</b> — the chart documents high-risk monitoring (prior discordant results, active MAT titration). These exceed the ceiling for <i>moderate</i> risk but sit inside the <i>high</i>-risk allowance. The documentation exists; it simply was not surfaced on the original claim. <b>Meritorious — appeal.</b><br><br>• <b>15 claims</b> — no risk-stratification statement anywhere in the record. The denial is factually correct. <b>I am not drafting appeals for these.</b> Appealing them burns staff time and, repeated, damages your credibility with the payer.<br><br>For the 23, packets are drafted with the LCD frequency section cited and the risk-tier documentation attached. They need your reviewer\'s attestation before I submit anything.'],
   ['u','What do we do about the 15?'],
   ['a','Prevention, not appeal. All 15 came from two ordering sites where the intake template has no risk-stratification field — so the clinician\'s assessment never reaches the note. That is a fixable upstream defect, and the Necessity Validation Agent will now flag orders from those sites before submission.<br><br>I have written the finding to the compliance log. Changing the template is a decision for your medical director.']],
  ev:'<b>Evidence status:</b> the $118 manual-appeal baseline is a published HFMA/Change Healthcare industry figure; the &lt;$15 and &lt;5 min figures are <b>modelled targets</b>, not measured Ardia results. Claim counts in the sample are synthetic. Appeal <i>success rate</i> is deliberately not claimed — it cannot be known pre-pilot.',
  hipaa:['De-identified before drafting','No fact asserted that is not in the retrieved record','Mandatory human attestation before submission','Hash-chained audit of draft + attestation','Merit gate — no baseless appeals']}
]},
{k:'pulmo',seg:'Chronic & Respiratory',c:'--pulmo',icon:'lungs',name:'PulmoIQ',role:'Respiratory Intelligence',agents:[
 {id:'pul-1',icon:'pulse',cat:'Longitudinal Tracking',badge:'Detection',name:'Respiratory Timeline Agent',
  desc:'Builds a continuous respiratory picture for asthma and COPD patients by fusing retrieved history, home vitals, <b>FDA-cleared</b> home spirometry and local air quality — establishing the personal baseline that makes a change meaningful.',
  personas:[['user','Pulmonologist'],['user','Care Manager'],['user','Patient / Caregiver']],
  metrics:[['4','Independent data streams fused per patient'],['90-day','Rolling baseline window for change detection'],['0','Diagnostic claims made — tracking only']],
  conditions:[
   ['Asthma','J45.20–J45.998','Intermittent through severe persistent; ACT score and rescue-inhaler frequency tracked against baseline.'],
   ['COPD','J44.0 · J44.1 · J44.9','GOLD 1–4 staging; exacerbation history and CAT score; FEV1/FVC &lt;0.70 post-bronchodilator.'],
   ['Obstructive sleep apnoea','G47.33','AHI severity tiers (5–15 mild, 15–30 moderate, &gt;30 severe); CPAP adherence.'],
   ['Bronchiectasis','J47.0 · J47.1 · J47.9','Exacerbation frequency and sputum-change tracking.'],
   ['Interstitial lung disease / IPF','J84.10 · J84.112','DLCO and FVC trajectory — decline rate matters more than any single value.'],
   ['Chronic respiratory failure','J96.10 · J96.11','Home oxygen dependence and SpO₂ floor monitoring.']],
  codes:['94010','94060','94726','94727','94728','94729','94640','95810','95811'],
  uc:[{t:'Baseline establishment and drift detection',trig:'Nightly aggregation across all enrolled respiratory patients',
    steps:['Pull the retrieved history and problem list, confirming the documented diagnosis and stage (GOLD / asthma severity).',
     'Ingest home vitals — <b>SpO₂</b>, heart rate, and activity — from HealthKit / Health Connect.',
     'Ingest lung-function values <b>only</b> from an <b>FDA-cleared home spirometer</b>. No wearable measures FEV1 or FVC, and we do not estimate it.',
     'Pull local <b>AQI</b> and pollen from AirNow / NOAA for the patient\'s area.',
     'Compute the rolling <b>90-day personal baseline</b> for each stream.',
     'Detect statistically meaningful drift — sustained SpO₂ decline, rising rescue-inhaler use, falling FEV1 trend.',
     'Assemble a clinician-facing timeline showing the change against baseline, with every source labelled.',
     'Where drift crosses a review threshold, surface it to the care team. <b>The agent does not predict an exacerbation</b> — that capability is regulated SaMD and is gated behind FDA clearance.'],
    out:'A clinician opens one timeline and sees what changed, when, from which source — instead of assembling it from four systems.'}],
  integ:['Apple HealthKit / Google Health Connect','FDA-cleared home spirometry devices','AirNow (EPA) air-quality API','NOAA weather/pollen','EHR FHIR R4 (Epic · Cerner · athenahealth)','Sentinel de-identification + audit kernel'],
  datasets:['Public AirNow/NOAA environmental data','Patient-generated device data under consent','No PHI used in model development'],
  conv:[['u','Anything I should look at on my COPD panel before clinic tomorrow?'],
   ['a','Three patients show meaningful drift against their own baselines. Ranked by how far outside normal variation they sit:<br><br><b>1. Patient A-2291</b> — GOLD 3, <code>J44.1</code>. Resting SpO₂ 90-day baseline <b>93.4%</b>; last 6 days averaging <b>90.1%</b>. Rescue-inhaler actuations up from ~2/day to <b>6/day</b>. Home spirometry (cleared device, 4 readings) shows FEV1 down <b>11%</b> from baseline. Regional AQI has been in the unhealthy band 4 of the last 6 days.<br><br><b>2. Patient B-0847</b> — asthma, <code>J45.40</code>. Night-time activity interruptions up 3× this week; no spirometry submitted since the 8th, so I have no lung-function confirmation.<br><br><b>3. Patient C-1130</b> — OSA <code>G47.33</code>. CPAP adherence dropped from 6.1 h/night to 3.4 h/night over two weeks.<br><br>To be explicit about what this is: these are <b>tracked changes against each patient\'s own baseline</b>. I am not predicting an exacerbation and not staging severity — that would be a regulated diagnostic function we have not cleared. Clinical interpretation is yours.'],
   ['u','On A-2291, is the air quality causing the decline?'],
   ['a','I cannot establish causation, and I will not imply it. What I can give you is the temporal relationship: the SpO₂ decline began on day 3 of the elevated-AQI stretch, and the rescue-inhaler increase began day 4. The correlation is visible in the timeline.<br><br>Confounders I can see in the record: a new prescription filled on the 12th, and a documented URI two weeks ago that may not be fully resolved. Any of these could account for the pattern.<br><br>What the data supports is "this patient changed, and here is everything that changed around them." The attribution is a clinical judgement.']],
  ev:'<b>Evidence status:</b> the fusion and baseline logic is implemented and deterministic. Patient figures in the sample are <b>synthetic</b>. PulmoIQ makes <b>no diagnostic or predictive claim</b> — exacerbation prediction and PFT interpretation are FDA-regulated SaMD and are deliberately deferred to a 510(k) pathway. No clinical validation is claimed.',
  hipaa:['Non-diagnostic by design','Lung function only from cleared devices','De-identified before any model call','Patient consent gates every data stream','510(k) pathway documented for the prediction lane']},
 {id:'pul-2',icon:'doc',cat:'Reimbursement',badge:'Administrative',name:'PFT & Sleep Coding Agent',
  desc:'Codes pulmonary-function and sleep studies correctly the first time, and tracks the <b>1 January 2027</b> deletion of the home sleep-apnoea test codes so labs are not billing retired codes into a denial.',
  personas:[['clip','Certified Coder'],['user','Pulmonary Lab Manager'],['user','Sleep Lab Manager']],
  metrics:[['9','PFT & sleep code families validated'],['1 Jan 2027','HSAT code-deletion transition tracked'],['100%','Claims with a documented interpretation linkage']],
  conditions:[['COPD','J44.x','Spirometry with bronchodilator responsiveness — 94010 → 94060 escalation logic.'],['Asthma','J45.x','Pre/post bronchodilator testing; 94060 documentation requirements.'],['Obstructive sleep apnoea','G47.33','Attended PSG (95810) vs. CPAP titration (95811) vs. home testing.'],['Interstitial lung disease','J84.x','Full plethysmography and DLCO — 94726–94729 family.'],['Chronic respiratory failure','J96.1x','Oxygen-titration study documentation.']],
  codes:['94010','94060','94726','94727','94728','94729','95810','95811','95800†','95801†','95806†'],
  denials:['CO-50','CO-4','CO-16','CO-151'],
  uc:[{t:'PFT claim validation',trig:'A pulmonary function study is finalised and ready to bill',
    steps:['Identify the study performed and map to the correct code family — simple spirometry (<b>94010</b>), bronchodilator responsiveness (<b>94060</b>), or full plethysmography/DLCO (<b>94726–94729</b>).',
     'Confirm a signed <b>physician interpretation and report</b> is on file — its absence is a leading cause of denial.',
     'Validate the linked diagnosis supports the study performed.',
     'Check modifier requirements and any payer-specific frequency limits.',
     'Flag <b>94010</b> billed where the documentation describes a pre/post bronchodilator study (should be <b>94060</b>).',
     'Return a coded, denial-checked claim with the supporting citation.'],
    out:'PFT claims bill at the level actually performed and documented — no downcoding losses, no upcoding exposure.'},
   {t:'2027 sleep-code transition guard',trig:'Any sleep-study claim with a date of service on or after 1 January 2027',
    steps:['Detect use of <b>95800</b>, <b>95801</b> or <b>95806</b> — deleted effective <b>1 January 2027</b>.',
     'Map the documented study type to its valid replacement code for the date of service.',
     'Re-validate the diagnosis linkage and interpretation requirement against the new code.',
     'Block submission of retired codes and return the corrected mapping.',
     'Report the affected volume so the lab can update its charge master before the cutover.'],
    out:'The lab crosses the 2027 boundary without a wave of invalid-code denials.'}],
  integ:['EDI 837P','CPT/HCPCS annual code sets','Payer PFT & sleep policy packs','Pulmonary lab / sleep lab systems','EHR FHIR R4','Sentinel audit kernel'],
  datasets:['Public CMS CPT/HCPCS code sets and change files','Public payer policy text','Synthetic PFT/sleep claim corpus'],
  conv:[['u','We bill a lot of 94010. Any exposure there?'],
   ['a','Yes, in both directions — and one of them is costing you money.<br><br>Across a synthetic sample matched to your study mix, <b>18%</b> of <code>94010</code> claims have documentation describing a <b>pre- and post-bronchodilator</b> study. That is <code>94060</code>, which carries a higher value. You are performing the work and billing the lesser code — a downcoding loss, not a compliance risk.<br><br>The opposite pattern appears in <b>4%</b>: <code>94060</code> billed where the report documents only a single baseline manoeuvre. That is upcoding exposure and I flag it hard.<br><br>Separately, <b>6%</b> of the sample has no signed interpretation on file at submission. That is a straight <b>CO-50</b> regardless of which code you choose.'],
   ['u','And the 2027 sleep code change?'],
   ['a'," Worth acting on before the cutover. <code>95800</code>, <code>95801</code> and <code>95806</code> are deleted effective <b>1 January 2027</b>. If your charge master still carries them on a 2027 date of service, those claims reject as invalid codes — not a medical-necessity fight, just an unbillable line.<br><br>I can produce the crosswalk from your current sleep-study mix to the valid 2027 replacements, and I will block any retired code from going out after the boundary. Updating the charge master itself is a human task on your side."]],
  ev:'<b>Evidence status:</b> code-set logic is deterministic and driven by published CMS code files. The 18% / 4% / 6% figures are from a <b>synthetic corpus</b> built to match a representative study mix — illustrative, not measured client results.',
  hipaa:['Administrative safe harbor — not a device','De-identified inputs','Human review on all code changes','Audit-logged']},
 {id:'pul-3',icon:'wind',cat:'Environmental',badge:'Preventive',name:'Air-Quality Trigger Agent',

  integ:['AirNow (EPA) API','NOAA weather & pollen','Aria companion delivery channel','Consented coarse location','Sentinel audit kernel'],
  datasets:['Public EPA AirNow historical + real-time AQI','Public NOAA data'],
  conv:[['u','What did you send my mother today?'],
   ['a','One nudge, at 7:40 this morning:<br><br>"Good morning. The air quality where you are is <b>poor today</b> (AQI 158, unhealthy). If you are heading out, going a little easier than usual is a good idea — and keep your rescue inhaler with you as you normally would."<br><br>It went out because her record documents COPD <code>J44.1</code>, which places her in the sensitive group, and PM2.5 crossed the unhealthy threshold for her area with a 2-day forecast of the same.<br><br>What I deliberately did <b>not</b> do: tell her to change any medication, tell her she is at risk of an exacerbation, or suggest she needs care. Those are clinical judgements. If she replies with symptoms, the Triage Agent handles it and escalates if it hears a red flag.']],
  ev:'<b>Evidence status:</b> environmental data is real and public (EPA AirNow, NOAA). No claim is made that nudges reduce exacerbations — that would require a prospective study we have not run.',
  hipaa:['Non-diagnostic by design','Coarse location only, consent-gated','No treatment advice','Nudge logged to the patient timeline','Alert-fatigue suppression']}
]},
{k:'aria',seg:'Elderly Care',c:'--aria',icon:'chat',name:'Aria',role:'Elder Companion',agents:[
 {id:'ari-1',icon:'route',cat:'Safety Routing',badge:'Safety-critical',name:'Triage & Routing Agent',
  desc:'Reads every incoming message before anything else does, and routes it — emergency, clinical question, or everyday conversation. Emergencies escalate immediately; requests for a diagnosis are refused safely. Deterministic, not left to the language model.',
  personas:[['user','Older Adult'],['user','Family Caregiver'],['user','Care Manager']],
  metrics:[['100%','Red-flag phrases escalated in the test suite (42/42 safety tests pass)'],['100%','Diagnosis and dosing requests refused in the test suite'],['0','PHI reaching the language model — de-identified first']],
  conditions:[
   ['Acute coronary syndrome (red flag)','I21.x','Chest pain, pressure, radiating arm/jaw pain → immediate escalation.'],
   ['Stroke (red flag)','I63.x','Face droop, arm weakness, speech difficulty → immediate escalation.'],
   ['Falls','W19.XXXA · R29.6','Reported fall or inability to get up → immediate escalation.'],
   ['Acute respiratory distress','J96.0x · R06.02','Cannot breathe, cannot finish a sentence → immediate escalation.'],
   ['Suicidal ideation / self-harm','R45.851','Any expression of intent → immediate crisis escalation, never a chatbot reply alone.'],
   ['Hypoglycaemia / confusion','E16.2 · R41.0','New confusion, shakiness, disorientation → escalation with context.']],
  codes:['—'],
  uc:[{t:'Per-turn safety triage',trig:'Every single inbound message, voice or text, before any reply is generated',
    steps:['De-identify the message under <b>HIPAA Safe Harbor</b> — this runs <b>first</b>, before any model call or log write.',
     'Screen against the deterministic <b>red-flag</b> phrase and symptom set (cardiac, stroke, respiratory, fall, self-harm, acute confusion).',
     'On a red-flag match, hand off to the <b>Escalation Agent</b> immediately and reply with emergency guidance. <b>The language model does not get a vote here.</b>',
     'Screen for diagnosis and medication-dosing requests; return the safe non-diagnostic refusal that routes to a clinician.',
     'Screen for distress signals that are not emergencies — loneliness, low mood — and route to the Companion Agent with that context.',
     'Pass everything remaining to the Companion Agent for normal conversation.',
     'Log the routing decision and its trigger to the audit trail.'],
    out:'No emergency is ever handled as small talk, and no diagnosis is ever offered — because the routing is rule-based, not model-dependent.'}],
  integ:['Sentinel de-identification kernel (runs first)','Deterministic red-flag rule set','Escalation Agent handoff','Companion Agent handoff','Crucible safety eval suite'],
  datasets:['Ardia red-team safety eval suite (refusal · escalation · de-identification cases)','Synthetic PHI corpus — no real patient data'],
  conv:[['u','I feel a heavy pressure in my chest and my left arm aches.'],
   ['a','<span class="who">Routed: EMERGENCY — no model discretion</span>This could be serious and it needs attention right now, not later.<br><br><b>Please call 911 (or your local emergency number) immediately.</b> If you have been prescribed nitroglycerin, take it as your doctor instructed. Sit down, stay still, and try to stay calm.<br><br>I am alerting <b>Priya</b> right now with your location and what you have told me.<br><br>I am not able to tell you what is causing this — that needs a clinician, urgently. Staying on the line with you.'],
   ['u','It is probably just my indigestion again, do I really need to call?'],
   ['a','I hear you, and I am not going to talk you out of your own read on your body. But chest pressure with left-arm ache is one of the specific combinations where <b>the cost of waiting is much higher than the cost of being wrong</b>. Indigestion and a cardiac event can feel similar, and I cannot tell them apart — no one can, from a conversation.<br><br>Please make the call. If it turns out to be indigestion, that is a good outcome and nobody will mind.<br><br>Priya has been alerted and should be reaching you. I am staying here.']],
  ev:'<b>Evidence status:</b> the triage and refusal logic is <b>implemented and unit-tested</b> — 42/42 safety assertions pass, covering red-flag escalation, diagnosis/dosing refusal and PHI de-identification. This is measured on Ardia\'s own eval suite, not a clinical trial. No claim is made about real-world emergency-detection sensitivity.',
  hipaa:['De-identification runs before any model call','Deterministic routing — LLM cannot override','Never diagnoses, never doses','Every routing decision audit-logged','Escalation consent captured in advance']},
 {id:'ari-2',icon:'bell',cat:'Emergency Response',badge:'Safety-critical',name:'Escalation & Alerting Agent',
  desc:'When an emergency signal fires — SOS, a fall, low blood oxygen, or prolonged immobility — this agent reaches the one or two family contacts the person chose in advance, with the context they need to act.',

  conv:[['u','I have been more out of breath going up the stairs this week, and my ankles look puffy.'],
   ['a','Thank you for telling me — those two things <b>together</b> are worth taking seriously, so let us be careful with them.<br><br>Here is what I am seeing when I put it against your own normal:<br>• You have <b>COPD</b> on file, and new or worse breathlessness on exertion is a change from your baseline.<br>• Swelling in <b>both</b> ankles is a separate signal, and I do not want to fold it into the breathing.<br>• Your activity over the last three days is down about <b>40%</b> from your 90-day average — Cadence flagged that this morning.<br>• Your weight is up <b>1.4 kg</b> since Friday.<br><br>Because this is a <b>change</b>, and because swelling and weight gain are showing up alongside the breathlessness, I would contact your clinician <b>today</b> rather than waiting for your appointment. I can help you place that call now.<br><br>Go straight to emergency care if your breathing suddenly gets much worse, if you cannot finish a sentence, if your lips or fingertips look blue, or if you cannot lie flat without gasping.<br><br><i>I am a companion, not a doctor — this is general information, not a diagnosis. Please confirm with your clinician.</i>'],

  ev:'<b>Evidence status:</b> guardrails (never diagnose, never dose, escalate red flags, disclaimer on every health reply) are <b>implemented and unit-tested</b> within the 42/42 suite. The <b>Cadence</b> baseline signal it uses is a real trained model — <b>95.5% accuracy on held-out subjects</b> (UCI HAR, CC BY 4.0), with the honest limitation that the public dataset\'s subjects are aged 19–48 and it <b>must be re-trained on older-adult data before deployment</b>. Patient figures in the conversation are synthetic. No clinical outcome claim is made.',
  hipaa:['Never diagnoses, never adjusts medication','Every health reply carries the disclaimer','De-identified before any model call','Retrieval-grounded — no free-form medical claims','Red flags leave this agent and go to Triage']}

  datasets:['Public MolDX policy text','Public CPT molecular pathology code set','Synthetic molecular claim corpus'],
  conv:[['u','This BRCA panel keeps coming back CO-11. The diagnosis is family history of breast cancer.'],
   ['a','<b>CO-11</b> is "diagnosis inconsistent with the procedure," but in molecular billing that code is often masking a registration problem rather than a true diagnosis mismatch. That is what is happening here.<br><br>Your claim carries <code>Z15.01</code> (genetic susceptibility to breast cancer) against <code>81162</code>. That pairing is correct — the indication is not your problem.<br><br>The problem is the <b>Z-code</b>. Your LIS is sending the menu name "Hereditary Breast Panel," which maps to <b>two</b> different registered assays in your catalogue with different gene content and different Z-codes. The claim went out with the Z-code for the smaller panel, but the report shows full <code>BRCA1/2</code> sequencing plus large-rearrangement analysis — that is the other assay.<br><br>The payer sees a Z-code describing one test and a CPT describing another, and rejects the pair.'],
   ['u','How do we stop that happening?'],
   ['a','The fix is upstream of billing. The claim needs to be built from the <b>assay identity</b> — manufacturer, version, gene content — not the menu display name. I can resolve assay-level identity against the DEX registry reliably; I cannot disambiguate a display name that legitimately points at two assays.<br><br>Two things needed from your side:<br><br><b>1.</b> Split the menu entry so each registered assay has its own orderable code in the LIS.<br><b>2.</b> Until that ships, I will hold any claim where the menu name is ambiguous and route it for coder confirmation of which assay was actually run.<br><br>For the existing denials — these are corrected-claim resubmissions, not appeals. The original claim was genuinely wrong. I have the corrected set drafted for your review.']],
  ev:'<b>Evidence status:</b> the <b>25–35%</b> molecular denial band is a published industry figure, not an Ardia result. Z-code resolution logic is deterministic against the DEX registry. Claim examples are synthetic. Pre-revenue — no measured client outcomes.',

  integ:['Payer PA requirement matrices','Payer coverage-policy corpus','NCCN guideline references','LIS order feed','EDI 278 where supported','Human submission queue'],
  datasets:['Public payer coverage policy text','Public NCCI/NCCN references','Synthetic order corpus'],
  conv:[['u','Does this 81455 need prior auth for a commercial PPO?'],
   ['a','Yes — <code>81455</code> (comprehensive genomic profiling, 51+ genes) requires prior authorization for every commercial payer in your current mix. It is one of the most consistently PA-gated molecular codes.<br><br>I have checked the record against this payer\'s criteria and here is the honest picture:<br><br><b>Met:</b> advanced-stage solid tumour documented (<code>C34.31</code>, stage IIIB NSCLC); prior systemic therapy documented; tissue adequacy noted by pathology.<br><br><b>Not met:</b> the policy requires the result to be capable of directing therapy selection. The note does not state a treatment decision that depends on the profiling. That is the gap most likely to produce a denial here.<br><br>I have drafted the packet with an NCCN citation for biomarker testing in advanced NSCLC, which supports the clinical case. But the missing element is a clinician statement, and I cannot write that on their behalf — it has to be their genuine reasoning.'],
   ['u','Can you just add a line saying it will direct therapy?'],

_mergeSol(window.__LAB_SOL);_mergeSol(window.__ELDER_SOL);_mergeSol(window.__ELDER2_SOL);_mergeSol(window.__ARIA_SOL);

function buildSide(){
 const segs=[...new Set(SOL.map(s=>s.seg))];
 let h='';
 segs.forEach(seg=>{h+=`<div class="side-h">${seg}</div>`;
  SOL.filter(s=>s.seg===seg).forEach(s=>{
   h+=`<div class="s-item" id="si-${s.k}" style="--c:var(${s.c})">

 document.getElementById('side').innerHTML=h;
}

 m.innerHTML=`

 ${a.codes&&a.codes[0]!=='—'?`<div class="sec"><div class="sec-l">Codes &amp; standards</div><div class="chips">${a.codes.map(c=>`<span class="chip cd">${c}</span>`).join('')}</div>${a.codes.some(c=>c.includes('†'))?`<div class="mnote">† deleted effective 1 January 2027 — transition tracked.</div>`:''}</div>`:''}

 <div class="sec"><div class="sec-l">Integrations</div><div class="chips">${a.integ.map(x=>`<span class="chip">${x}</span>`).join('')}</div></div>
